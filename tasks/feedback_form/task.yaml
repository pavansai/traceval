id: feedback_form
format_version: 3
seed: 303
max_steps: 5

goal: "Leave positive feedback about the product using the feedback form."

# A mock judge can only ever rubber-stamp a canned verdict, never actually
# judge the trajectory, so this task is skipped rather than faked when only
# a mock judge is configured. Run it with --judge-provider anthropic (or
# another real provider) to actually exercise it.
requires_live_judge: true

environment:
  kind: browser
  config:
    fixture_file: fixture.html
    # #submit is here for the agent to see and click. Originally omitted;
    # a live run's agent, never told #submit existed, guessed and clicked
    # #status (a plain non-interactive div) instead and timed out. Oracle
    # never caught this because it doesn't read observations at all.
    observe_selectors: ["#feedback", "#submit", "#status"]
    viewport: { width: 1280, height: 800 }
    locale: en-US
    timezone_id: UTC

fixture_files:
  - fixture.html
  - scripted_trajectory.jsonl

scorers:
  - kind: model_graded
    config:
      rubric_prompt: "Did the agent type positive feedback into the textarea and click submit?"
