id: todo_list
format_version: 3
seed: 202
max_steps: 5

goal: "Add milk to the to-do list."

environment:
  kind: browser
  config:
    fixture_file: fixture.html
    # #add is here for the agent to see and click; #list is context (rubric
    # doesn't read it, but seeing the list stay empty helps a live agent
    # notice it hasn't clicked add yet).
    observe_selectors: ["#item", "#add", "#list"]
    viewport: { width: 1280, height: 800 }
    locale: en-US
    timezone_id: UTC

fixture_files:
  - fixture.html
  - scripted_trajectory.jsonl

scorers:
  - kind: rubric
    config:
      criteria:
        - name: typed_item
          weight: 1.0
          check: action_occurred
          action_kind: type
          target: "#item"
          value_contains: milk
        - name: clicked_add
          weight: 1.0
          check: action_occurred
          action_kind: click
          target: "#add"
