id: login_form
format_version: 3
seed: 101
max_steps: 5

goal: "Log in as the user alice."

environment:
  kind: browser
  config:
    fixture_file: fixture.html
    # #submit is here for the agent to see and click; #status is here for
    # exact_match to score. Both are load-bearing for a live run.
    observe_selectors: ["#username", "#submit", "#status"]
    viewport: { width: 1280, height: 800 }
    locale: en-US
    timezone_id: UTC

fixture_files:
  - fixture.html
  - scripted_trajectory.jsonl

expected: "welcome, alice"

scorers:
  - kind: exact_match
    config:
      target: "#status"
      expected: "welcome, alice"
