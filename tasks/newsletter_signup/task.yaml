id: newsletter_signup
format_version: 3
seed: 404
max_steps: 5

goal: "Sign up for the newsletter using the email address reader@example.com."

environment:
  kind: browser
  config:
    fixture_file: fixture.html
    # #subscribe is here for the agent to see and click; #status is here
    # for exact_match to score.
    observe_selectors: ["#email", "#subscribe", "#status"]
    viewport: { width: 1280, height: 800 }
    locale: en-US
    timezone_id: UTC

fixture_files:
  - fixture.html
  - scripted_trajectory.jsonl

expected: "subscribed: reader@example.com"

scorers:
  - kind: exact_match
    config:
      target: "#status"
      expected: "subscribed: reader@example.com"
  - kind: rubric
    config:
      criteria:
        - name: typed_email
          weight: 1.0
          check: action_occurred
          action_kind: type
          target: "#email"
          value_contains: reader@example.com
        - name: clicked_subscribe
          weight: 1.0
          check: action_occurred
          action_kind: click
          target: "#subscribe"
