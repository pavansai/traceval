[project]
name = "traceval"
version = "0.1.0"
description = "Deterministic task runner and scoring harness for multi-step agent rollouts"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9,<3",
    "typer>=0.15,<1",
    "pyyaml>=6.0,<7",
    "playwright>=1.48,<2",
    "anthropic>=0.40,<1",
]

[project.scripts]
traceval = "traceval.cli.main:app"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8.3,<9",
    "ruff>=0.7,<1",
    "mypy>=1.13,<2",
    "types-pyyaml>=6.0,<7",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# typer.Argument()/typer.Option() as parameter defaults is the idiomatic
# typer pattern, not the mutable-default footgun B008 warns about.
"src/traceval/cli/main.py" = ["B008"]

[tool.mypy]
python_version = "3.12"
strict = true
disallow_untyped_defs = true
exclude = ["tests/fixtures"]

[tool.pytest.ini_options]
testpaths = ["tests/unit", "tests/integration"]
