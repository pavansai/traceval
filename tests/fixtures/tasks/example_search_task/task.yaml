id: example_search_task
format_version: 3
seed: 12345
max_steps: 5

goal: "Search for \"playwright\" and view the result."

environment:
  kind: browser
  config:
    fixture_file: fixture.html
    observe_selectors: ["#query", "#result"]
    viewport: { width: 1280, height: 800 }
    locale: en-US
    timezone_id: UTC

fixture_files:
  - fixture.html
  - scripted_trajectory.jsonl

expected: "found: playwright"

scorers:
  - kind: exact_match
    config:
      target: "#result"
      expected: "found: playwright"
  - kind: rubric
    config:
      criteria:
        - name: typed_query
          weight: 1.0
          check: action_occurred
          action_kind: type
          target: "#query"
          value_contains: playwright
        - name: clicked_search
          weight: 1.0
          check: action_occurred
          action_kind: click
          target: "#search"
